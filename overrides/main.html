{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
  <script>
    (function() {
      var lockY, lockTimer;
      function lockScroll() { window.scroll(0, lockY); }
      document.addEventListener('click', function(ev) {
        if (ev.target.closest('[data-md-component="palette"]')) {
          clearTimeout(lockTimer);
          window.removeEventListener('scroll', lockScroll);
          lockY = window.scrollY;
          window.addEventListener('scroll', lockScroll, { passive: false });
          lockTimer = setTimeout(function() {
            window.removeEventListener('scroll', lockScroll);
          }, 700);
        }
      }, true);
    })();
  </script>
{% endblock %}

{% block header %}
  {{ super() }}
{% endblock %}

{% block footer %}
  {{ super() }}
  <div class="md-footer-klein-banner">
    <div class="md-footer-klein-banner__inner md-grid">
      <div class="md-footer-klein-banner__text">mqiu.dev / blog</div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ super() }}
{% endblock %}
